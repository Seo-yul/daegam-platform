[project]
name = "daegam-mock-oidc"
version = "0.1.0"
description = "Mock OIDC provider for Daegam dev/e2e: discovery, JWKS, client_credentials, test user tokens"
requires-python = ">=3.12"
license = "LicenseRef-PolyForm-Strict-1.0.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # 요청·응답 모델을 직접 import 한다 (D29)
    "pydantic>=2",
    "PyJWT[crypto]>=2.14",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mock_oidc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

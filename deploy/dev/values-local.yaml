# 로컬 개발 클러스터의 대감 차트 값 (P85 4절). make deploy-local 이 이 파일로 helm upgrade --install 하고, 이 checkout 의
# 이미지 태그와 make 변수(LOCAL_HOST, INGRESS_CLASS, MONGO, LLM_GATEWAY…)는 scripts/deploy-local.sh 가 그 위에 얹는다.
# OrbStack 과 태그의 클러스터 e2e 잡이 만든 k3d 가 쓴다. header 모드는 요청한 사람을 확인하지 않으므로 다른 사람이 닿는
# 클러스터에는 이 값으로 올리지 않는다. Secret 셋은 차트가 처음 한 번 만들고 지킨다(P85 16절). 그래서 클러스터
# e2e 잡이 후보마다 만들기와 산 Secret 읽기를 지난다

# 로컬 호스트. /etc/hosts 에 Traefik LoadBalancer IP 로 잇는다. .test 는 공용 DNS 에 없는 예약 TLD(RFC 6761)라 매핑이
# 없으면 이름이 풀리지 않을 뿐 요청이 밖의 서버로 나가지 않는다. scripts/lib/hosts.sh 의 local_host 가 이 줄을 글자로
# 읽으므로 따옴표 없이 둔다(make deploy-local LOCAL_HOST=… 가 덮는다)
host: daegam.test
scheme: http

auth:
  # 요청한 사람을 확인하지 않고 모두 platform-admin 으로 본다. 인증 모드를 바꾸는 e2e 는 ConfigMap 을 고쳐 local·oidc 로
  # 바꿨다가 되돌린다(scripts/lib/e2e_auth_mode.sh)
  mode: header
  allowHeaderMode: true
  # local 로 바꾼 e2e 가 이 이름의 첫 관리자로 들어간다(scripts/lib/e2e_local_auth.sh)
  adminUsername: admin
  # 매핑 표에 platform-admin 이 하나도 없을 때만 힘을 갖는 그룹. oidc 로 바꾼 e2e 의 토큰이 싣는다
  bootstrapAdminGroup: platform-admins
  oidc:
    # 클러스터 안 시험용 IdP(deploy/dev/mock-oidc.yaml). oidc 로 바꾸는 e2e 가 그 토큰을 쓴다
    issuer: http://mock-oidc.daegam-system.svc:8080
    audience: daegam-api
    insecureHttp: true

ingress:
  # Traefik 은 helm install traefik traefik/traefik -n traefik --create-namespace 로 따로 설치한다
  className: traefik

home:
  exposure:
    enabled: true
    # 노출 NetworkPolicy 가 Traefik 파드의 네임스페이스에서 오는 연결만 받는다
    controllerNamespace: traefik
    # header 모드라 무인증 노출을 허용한다
    allowUnauthenticated: true

images:
  # make image-* 가 구운 로컬 이미지다. docker.io/library/<이름> 은 노드가 가진 <이름> 과 같은 이미지다. 태그는
  # scripts/deploy-local.sh 가 dev-<이미지 ID> 로 준다
  registry: docker.io/library
  pullPolicy: IfNotPresent

platform:
  # 개발용 스위치 둘(D25, D95)과 쉬는 창(D103)은 ConfigMap 키로 둔다. e2e 가 게이트 동안 ConfigMap 을 고쳐 끄고 켠다
  # (scripts/lib/e2e_control_plane.sh config_window_apply). 릴리스 산출물에는 두지 않고 이 파일에만 둔다
  extraConfig:
    # P12 (D26): kind stub provider 등록 허용. e2e 와 로컬 실증 전용 예외다
    DAEGAM_ALLOW_STUB_PROVIDER: "true"
    # P40 (D95): home 클러스터에서만 격리 점검 없이 코드 실행 샌드박스를 연다. 기록은 unchecked 이고 샌드박스의 자체 점검은
    # 끝나지 않고 알리기만 한다
    DAEGAM_SANDBOX_ALLOW_UNCHECKED: "true"
    # P44 (D103): 쉬는 창을 0 으로 둔다. 로컬 배포와 k3d 의 게이트는 Agent 를 스스로 재우지 않는다. 플랫폼 기본이 A4 에서
    # 1800 으로 바뀌어도 그대로이고, e2e-provisioning 만 게이트 동안 창을 줄였다가 0 으로 되돌린다
    DAEGAM_AGENT_SLEEP_AFTER_SECONDS: "0"

mongodb:
  # 클레임 템플릿은 처음 만든 뒤 바꾸지 못하므로 차트 이전의 로컬 MongoDB 와 같은 크기와 기본 StorageClass 다
  size: 1Gi

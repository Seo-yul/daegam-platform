# daegam-ui (D52). UI 정적 빌드만 낸다. /api/·/.well-known/·/healthz 는 Ingress 가 플랫폼으로 보내 여기 오지 않는다.
# 규칙은 D20·D52 다. 루트 파일 시스템이 읽기 전용이라 쓰는 곳(pid·임시 경로·기동 때 만든 CSP)은 전부 /tmp 다.
#
# 이 파일과 security.conf 의 헤더 값은 플랫폼 platform/daegam/security_headers.py 와 같아야 한다.
# 같은지는 platform/tests/test_ui_csp_parity.py 가 본다.

# 기본값 auto 는 컨테이너 한도가 아니라 노드 CPU 를 센다. 18 CPU 노드에서 워커 18개가 떠 64Mi 한도에 닿는다
worker_processes 2;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  # kubelet probe(5초·20초)는 접근 로그에서 뺀다. 파드 둘이면 분에 서른 줄이 넘는다
  map $http_user_agent $daegam_access_log {
    ~^kube-probe/ 0;
    default 1;
  }
  access_log /dev/stdout combined if=$daegam_access_log;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

  # HSTS 는 https 로 들어온 요청에만 붙인다. TLS 는 Ingress 에서 끝나므로 원래 scheme 은 X-Forwarded-Proto 의
  # 첫 값이다(앞뒤 공백 무시, 대소문자 무시. 플랫폼 security_headers._is_https 와 같은 판정). 로컬(http)에서
  # 붙이면 브라우저가 그 호스트를 https 로 고정해 로컬 배포가 깨진다. max-age 는 HSTS_MAX_AGE(반년)다
  map $http_x_forwarded_proto $daegam_hsts {
    default "";
    "~*^\s*https\s*(?:,|$)" "max-age=15552000; includeSubDomains";
  }

  # $daegam_csp. 기동 때 start.sh 가 ConfigMap 의 인증 모드로 만든다
  include /tmp/daegam/csp.conf;

  # oidc 의 silent renew iframe 이 같은 origin 에서 /callback 을 연다. 그 응답만 같은 origin 의 프레임을 허락하고
  # 다른 화면은 어디에도 프레임으로 넣을 수 없다(플랫폼 security_headers 의 DENY 와 같다). $uri 가 아니라 요청 줄의
  # 원문($request_uri)으로 가른다. /callback 은 파일이 아니라 try_files 가 /index.html 로 안에서 넘기므로, 헤더를 붙일
  # 때의 $uri 는 이미 /index.html 이다. /callback/·/%63allback 같은 변형은 맞지 않아 DENY 로 남는다
  map $request_uri $daegam_xfo {
    default "DENY";
    "~^/callback(?:\?|$)" "SAMEORIGIN";
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    # 리다이렉트를 상대 주소로 낸다. 켜 두면 nginx 가 자기 포트 8080 을 붙인 절대 주소를 만들어 Ingress 뒤에서
    # 닿지 않는다
    absolute_redirect off;

    # 보안 헤더는 여기 한 번 둔다. nginx 는 location 에 add_header 가 하나라도 있으면 위 단계의 것을 물려받지 않는데,
    # merge 면 합쳐 받는다(1.29.3+). location 을 더하며 헤더를 빠뜨릴 길이 없어진다. 서버 단계에 있으므로 location 을
    # 고르기 전에 끝나는 응답(잘못된 요청 줄, 루트 밖으로 나가는 경로의 400)에도 붙는다
    add_header_inherit merge;
    include /etc/nginx/daegam/security.conf;

    # 앱 껍데기. 재배포마다 새 해시 에셋을 가리키므로 캐시하지 않는다(매번 재검증, 바뀌지 않았으면 304)
    location = /index.html {
      add_header Cache-Control "no-cache" always;
    }

    # 해시가 붙은 에셋은 내용이 바뀌면 이름이 바뀌므로 오래 캐시한다. 없는 파일은 index.html 이 아니라 404 다.
    # immutable 은 성공 응답에만 붙인다(always 없음). 404 에 붙으면 롤링 중 잠깐 없던 에셋이 브라우저에 1년간
    # 없는 것으로 남는다
    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 실제 파일이면 파일을(favicon·build.json 등), 아니면 index.html 을 준다. react-router 가 경로를 해석한다.
    # GET·HEAD 가 아닌 요청은 정적 모듈이 405 로 끊는다
    location / {
      try_files $uri /index.html;
      add_header Cache-Control "no-cache" always;
    }
  }

  # kubelet 의 준비 확인만 받는다. Service 는 8080 만 열어 Ingress 로는 닿지 않는다. 파드가 내려갈 때 preStop 의
  # daegam-ui-drain 이 /tmp/daegam/draining 을 두면 503 이 되어 Traefik 이 이 파드를 뺀다. sticky 쿠키로 이 파드에
  # 붙은 브라우저도 그때 다른 파드로 옮긴다. 8080 은 preStop 이 끝날 때까지 그대로 낸다(D52)
  server {
    listen 8081;
    access_log off;
    root /usr/share/nginx/html;

    location = /ready {
      if (-f /tmp/daegam/draining) {
        return 503;
      }
      # 앱 껍데기를 낼 수 있을 때만 준비다. 못 내는 이미지면 롤아웃이 그 파드에서 멈추고 옛 파드가 계속 낸다
      try_files /index.html =503;
    }

    location / {
      return 404;
    }
  }
}

# daegam-ui 보안 헤더 (D52). nginx.conf 의 server 가 한 번 include 하고 add_header_inherit merge 로 location 에 내린다.
# 값은 플랫폼 platform/daegam/security_headers.py 가 API 응답에 붙이는 것과 같아야 한다. 같은지는
# platform/tests/test_ui_csp_parity.py 가 본다. always 라 404·405·3xx 에도 붙는다. 변수 값이 비면($daegam_hsts 가
# http 일 때) nginx 가 그 헤더를 내지 않는다.
add_header Content-Security-Policy $daegam_csp always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options $daegam_xfo always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security $daegam_hsts always;

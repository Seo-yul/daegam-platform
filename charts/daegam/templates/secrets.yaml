{{- /*
차트가 만드는 Secret (P85 5절). existingSecret 이 없는 것만 만든다. 값은 daegam.generatedSecrets 가 산 Secret 에서 읽거나
한 번 만든다. helm uninstall 이 지우지 않도록 keep 이다. 값은 릴리스 기록에도 남으므로 그것을 원하지 않으면 existingSecret 을 쓴다
*/ -}}
{{- if eq .Values.target "home" }}
{{- $kinds := include "daegam.generatedKinds" . | fromJsonArray -}}
{{- $s := include "daegam.generatedSecrets" . | fromJson -}}
{{- $ns := .Release.Namespace -}}
{{- if has "mongo" $kinds }}
---
# MongoDB 가 빈 볼륨으로 처음 뜰 때 root 사용자를 이 값으로 만든다. 그 뒤로는 바꿔도 root 사용자는 그대로다
apiVersion: v1
kind: Secret
metadata:
  name: daegam-mongo-auth
  namespace: {{ $ns }}
  labels:
    {{- include "daegam.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  username: {{ $s.mongoUsername | b64enc }}
  password: {{ $s.mongoPassword | b64enc }}
{{- end }}
{{- if has "platform" $kinds }}
---
# 플랫폼이 envFrom 으로 읽는다. MongoDB URL 의 비밀번호는 위 daegam-mongo-auth 와 같은 값이다. 첫 관리자는 users 가 빌 때
# 이 이름과 비밀번호로 한 번 생기고, 처음 로그인할 때 비밀번호를 바꾸라고 한다(D40)
apiVersion: v1
kind: Secret
metadata:
  name: daegam-platform-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "daegam.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  DAEGAM_MONGO_URL: {{ include "daegam.mongoUrl" (dict "user" $s.mongoUsername "password" $s.mongoPassword "ns" $ns) | b64enc }}
  DAEGAM_LOCAL_BOOTSTRAP_USERNAME: {{ $s.adminUsername | b64enc }}
  DAEGAM_LOCAL_BOOTSTRAP_PASSWORD: {{ $s.adminPassword | b64enc }}
{{- end }}
{{- if has "docparse" $kinds }}
---
# 문서 파싱 서비스의 요청 토큰 (D61). 플랫폼 비밀 묶음과 따로 두어 그 서비스는 이 키 하나만 받는다
apiVersion: v1
kind: Secret
metadata:
  name: daegam-docparse-token
  namespace: {{ $ns }}
  labels:
    {{- include "daegam.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ $s.docparseToken | b64enc }}
{{- end }}
{{- end }}

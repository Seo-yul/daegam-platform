{{- /*
문서 파싱 서비스 daegam-docparse (D61). 플랫폼 이미지를 명령만 바꿔 띄운다. 첨부와 Knowledge 문서의 파서(libxml2, pypdf,
openpyxl)를 SA 토큰과 플랫폼 비밀이 있는 플랫폼 파드 밖에서 돌린다. 받는 비밀은 요청을 확인하는 토큰 하나이고 플랫폼
설정(ConfigMap, Secret)은 읽지 않는다. 요청마다 새 하위 프로세스가 스스로를 가두고 뽑는다(daegam/documents/sandbox.py).
그 전제가 아래 보안 값이다. RLIMIT_NPROC 은 capabilities 가 없는 루트 아닌 프로세스에만 걸린다.
*/ -}}
{{- if eq .Values.target "home" }}
{{- $docparseSha := include "daegam.docparseTokenSha" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daegam-docparse
  namespace: {{ .Release.Namespace }}
  labels:
    app: daegam-docparse
    {{- include "daegam.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.docparse.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: daegam-docparse}
  template:
    metadata:
      labels: {app: daegam-docparse}
      {{- with $docparseSha }}
      annotations:
        daegam.devops.ai.kr/docparse-token-sha: {{ . | quote }}
      {{- end }}
    spec:
      # 쿠버네티스 API 를 부르지 않는다
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- include "daegam.pullSecrets" . | nindent 6 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: daegam-docparse}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: docparse
          image: {{ include "daegam.image" (list . .Values.images.platform) }}
          imagePullPolicy: {{ include "daegam.pullPolicy" (list . .Values.images.platform) }}
          command: ["python", "-m", "daegam.documents.server"]
          ports:
            - {name: http, containerPort: 9100}
          env:
            - name: DAEGAM_DOCPARSE_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "daegam.secretName.docparse" . }}, key: token}
            {{- with .Values.docparse.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # 플랫폼과 같은 까닭으로 엔드포인트에서 빠지는 동안 몇 초 더 받는다. 기다리는 방법도 플랫폼처럼 sleep 동작이다
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.docparse.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            # HOME. 추출은 디스크에 쓰지 않는다. 하위 프로세스가 채우지 못하게 작게 둔다
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: daegam-docparse
  namespace: {{ .Release.Namespace }}
  labels:
    app: daegam-docparse
    {{- include "daegam.labels" . | nindent 4 }}
spec:
  selector: {app: daegam-docparse}
  ports:
    - {name: http, port: 9100, targetPort: http}
{{- if include "daegam.pdb" .Values.docparse }}
---
# 자발적 중단 동안 문서 파싱 파드를 하나는 남긴다. 노드가 하나인 클러스터는 끈다 (D54)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: daegam-docparse
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "daegam.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: daegam-docparse}
{{- end }}
---
# 플랫폼 파드에서 오는 것만 받고 나가는 길은 모두 닫는다(DNS 포함). 테넌트 네임스페이스 정책은 이 네임스페이스 전체를
# 받아들이므로(D16) 파서에서 코드 실행을 얻어도 테넌트 파드로 가지 못하게 하는 방어선 하나다. 집행은 CNI 가 NetworkPolicy 를
# 지원할 때만이라 보호의 중심은 하위 프로세스 가두기와 토큰이다(D38). kubelet probe 는 노드에서 오는 연결이라 막히지 않는다
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: daegam-docparse
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "daegam.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: daegam-docparse}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: daegam-platform}
      ports:
        - {protocol: TCP, port: 9100}
{{- end }}

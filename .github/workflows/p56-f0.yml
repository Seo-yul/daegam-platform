# P56 의 F0.1·F0.4·F0.5(런타임 쪽)·F0.6 측정 (docs/plan/phase-56-code-mode.md 8절). 손으로만 돈다(workflow_dispatch). 태그의 클러스터 e2e
# 잡(e2e-cluster.yml)처럼 arm64 실행기 안에 k3d 클러스터를 띄우고, 이미지를 그 자리에서 구워 노드에 넣은 뒤 ToolHive
# 오퍼레이터·Traefik·대감 차트(deploy/dev/values-local.yaml)를 올려 scripts/f0/p56.sh 를 부른다. k3s 는 NetworkPolicy 를
# 집행한다. 비밀을 읽지 않고 레지스트리에 밀지 않는다. 결과는 잡 로그, 잡 요약과 아티팩트 f0-results-p56 이고 토큰·
# 비밀번호를 싣지 않는다. 이 파일과 scripts/f0 의 P56 도구는 F0 측정 동안만 둔다.
#
# 한 잡이 한 클러스터에서 setup 뒤에 고른 항목을 차례로 돈다(setup 의 Gateway·local 모드·개인 토큰을 함께 쓴다). 한
# 항목이 실패해도 다음 항목이 돈다. 차례는 items 의 순서가 아니라 단계의 순서다. 메트릭의 기준이 다른 항목의 호출을
# 세지 않도록 F0.4 가 맨 앞이고, 파드를 죽이는 F0.6 이 맨 뒤다.
#
#   gh workflow run p56-f0.yml -R <저장소> --ref develop -f items="f0.1 f0.4 f0.5 f0.6"

name: p56-f0

on:
  workflow_dispatch:
    inputs:
      items:
        description: "items to run, space separated (f0.1 f0.4 f0.5 f0.6)"
        type: string
        default: "f0.1 f0.4 f0.5 f0.6"

permissions:
  contents: read

concurrency:
  group: p56-f0-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_FROZEN: "1"
  # e2e-cluster.yml·p54-f0.yml 과 같은 판과 체크섬이다
  K3D_VERSION: v5.9.0
  K3D_SHA256: 03cde5cf23e6e8e67de5a039ecf26e5b85aca82fba3e5d13dadf904cd218a250
  K3S_IMAGE: rancher/k3s:v1.36.5-k3s1
  KUBECTL_VERSION: v1.36.5
  KUBECTL_SHA256: 88fc1aca8fd0c1b44fe379f67c39bd6858bdfc50241dc55775f84d0f5b31da3a
  HELM_VERSION: v3.21.4
  HELM_SHA256: b54c04b4e0b2540bbdc08c17a121dab70e9a2ed0de5705528fec68a5fd3b85a7
  TRAEFIK_CHART_VERSION: 41.6.1
  CLUSTER: daegam
  KUBE_CONTEXT: k3d-daegam

jobs:
  f0:
    name: f0 (p56)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: items
        env:
          ITEMS: ${{ inputs.items }}
        run: |
          for i in $ITEMS; do
            case "$i" in f0.1 | f0.4 | f0.5 | f0.6) ;; *) echo "::error::unknown item $i (f0.1 f0.4 f0.5 f0.6)"; exit 1 ;; esac
          done
          [ -n "${ITEMS// /}" ] || { echo "::error::nothing to run"; exit 1; }
          echo "#### p56-f0: $ITEMS" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            platform/uv.lock
            agent-runtime/uv.lock
          python-version: "3.12"
      - name: tools
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"
          curl -fsSL -o "$bin/k3d" "https://github.com/k3d-io/k3d/releases/download/$K3D_VERSION/k3d-linux-arm64"
          curl -fsSL -o "$bin/kubectl" "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/arm64/kubectl"
          curl -fsSL -o "$RUNNER_TEMP/helm.tgz" "https://get.helm.sh/helm-$HELM_VERSION-linux-arm64.tar.gz"
          sha256sum -c - <<EOF
          $K3D_SHA256  $bin/k3d
          $KUBECTL_SHA256  $bin/kubectl
          $HELM_SHA256  $RUNNER_TEMP/helm.tgz
          EOF
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-arm64/helm
          mv "$RUNNER_TEMP/linux-arm64/helm" "$bin/helm"
          chmod +x "$bin/k3d" "$bin/kubectl" "$bin/helm"
          echo "$bin" >>"$GITHUB_PATH"
          # 결과(아티팩트로 올린다)와 단계 사이의 상태(개인 토큰이 있어 올리지 않는다)
          mkdir -p "$RUNNER_TEMP/f0-results" "$RUNNER_TEMP/p56-state"
          { echo "F0_OUT=$RUNNER_TEMP/f0-results"; echo "F1_STATE=$RUNNER_TEMP/p56-state"; } >>"$GITHUB_ENV"
      - name: uv sync (platform)
        working-directory: platform
        run: uv sync
      # F0.1 이 런타임의 MCP 클라이언트를 프로세스로 부른다(scripts/f0/p56_runtime.py)
      - name: uv sync (agent-runtime)
        working-directory: agent-runtime
        run: uv sync
      # 플랫폼·UI 와 MCP Server 가 쓰는 MCP 런타임만 굽는다. 시험 서버는 플랫폼 이미지 위에서 돈다(scripts/f0/lib.sh)
      - name: build images
        run: |
          make image-runtime image-platform image-ui
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -E '^daegam-'
      - name: create the k3d cluster
        run: |
          k3d cluster create "$CLUSTER" --image "$K3S_IMAGE" --k3s-arg '--disable=traefik@server:*' --wait --timeout 180s
          kubectl --context "$KUBE_CONTEXT" get nodes -o wide
      # e2e-cluster.yml 과 같다. 노드의 containerd 에 바로 넣고 빠진 것만 한 번 더 넣는다
      - name: import images
        run: |
          images=(daegam-platform:0.1.0 daegam-ui:0.1.0 daegam-mcp-runtime:0.1.0)
          missing=("${images[@]}")
          for attempt in 1 2; do
            [ "$attempt" = 1 ] || echo "::warning::not in the k3d node after import, importing again: ${missing[*]}"
            k3d image import -c "$CLUSTER" --mode direct "${missing[@]}"
            have="$(docker exec "k3d-$CLUSTER-server-0" crictl images -o json)"
            left=()
            for i in "${missing[@]}"; do
              grep -q "\"docker.io/library/$i\"" <<<"$have" || left+=("$i")
            done
            missing=(${left[@]+"${left[@]}"})
            [ "${#missing[@]}" -gt 0 ] || break
          done
          for i in ${missing[@]+"${missing[@]}"}; do echo "::error::$i is not in the k3d node"; done
          [ "${#missing[@]}" -eq 0 ]
      - name: traefik
        run: |
          helm repo add traefik https://traefik.github.io/charts >/dev/null
          helm --kube-context "$KUBE_CONTEXT" upgrade -i traefik traefik/traefik --version "$TRAEFIK_CHART_VERSION" \
            -n traefik --create-namespace --wait --timeout 180s
          kubectl --context "$KUBE_CONTEXT" -n traefik get svc traefik
      - name: make operator-install
        run: make operator-install KUBE_CONTEXT="$KUBE_CONTEXT"
      - name: make deploy-local
        run: make deploy-local KUBE_CONTEXT="$KUBE_CONTEXT" PLATFORM_TAG=0.1.0 UI_TAG=0.1.0
      - name: setup
        id: setup
        run: bash scripts/f0/p56.sh setup
      # 항목마다 한 단계다. 한 항목이 실패해도 다음 항목이 돈다(setup 이 끝냈다)
      - name: f0.4
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && contains(format(' {0} ', inputs.items), ' f0.4 ') }}
        run: bash scripts/f0/p56.sh f0.4
      - name: f0.1
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && contains(format(' {0} ', inputs.items), ' f0.1 ') }}
        run: bash scripts/f0/p56.sh f0.1
      - name: f0.5
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && contains(format(' {0} ', inputs.items), ' f0.5 ') }}
        run: bash scripts/f0/p56.sh f0.5
      - name: f0.6
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && contains(format(' {0} ', inputs.items), ' f0.6 ') }}
        run: bash scripts/f0/p56.sh f0.6
      - name: diagnostics
        if: ${{ failure() }}
        continue-on-error: true
        # 로그는 공개이므로 자격 증명처럼 보이는 값을 지운다(scripts/f0/redact.sh)
        run: |
          k=(kubectl --context "$KUBE_CONTEXT")
          {
            "${k[@]}" get pods -A -o wide || true
            "${k[@]}" get events -A --sort-by=.lastTimestamp 2>/dev/null | tail -n 80 || true
            "${k[@]}" -n daegam-system logs deploy/daegam-platform --tail=200 || true
            "${k[@]}" -n toolhive-system logs deploy/toolhive-operator --tail=150 || true
            "${k[@]}" get virtualmcpservers,mcpservers,mcpauthzconfigs -A || true
            "${k[@]}" get pods -A -l app.kubernetes.io/name=virtualmcpserver \
              -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{" restarts="}{.status.containerStatuses[0].restartCount}{" last="}{.status.containerStatuses[0].lastState.terminated.reason}{"\n"}{end}' || true
          } 2>&1 | bash scripts/f0/redact.sh
      - name: summary
        if: ${{ always() }}
        run: |
          { echo "#### p56-f0"; echo; cat "$F0_OUT/summary.md" 2>/dev/null || echo "no results"; } >>"$GITHUB_STEP_SUMMARY"
      - name: results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f0-results-p56
          path: ${{ runner.temp }}/f0-results
          retention-days: 30
          if-no-files-found: warn

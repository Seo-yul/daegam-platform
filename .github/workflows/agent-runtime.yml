# CI(agent-runtime): ruff + pytest + docker build 와 import 확인 한 번. 언제 도는지는 platform.yml 과 같다(PR 에서는
# agent-runtime/ 이 바뀌었거나 플랫폼 갈래가 돌 때 pr-check 가 부른다).
# 테스트는 make verify-runtime 처럼 Postgres·Redis 서비스 컨테이너에 붙어 실제 저장소 테스트까지 돈다(가짜 MCP
# 서버는 in-process FastMCP). DAEGAM_TEST_REQUIRE_STORES 를 함께 주므로 주소가 비면 pytest 가 실제 저장소 테스트를
# 건너뛰지 않고 시작부터 멈춘다. docker build 뒤에는 그 이미지의 python 으로 psycopg 와 deepagents 를 import 한다.
# distroless 이미지에는 libpq 가 없으므로 psycopg 가 binary 휠의 libpq 로 실리는지는 이렇게 돌려 봐야 안다. 서버는
# 띄우지 않는다.

name: agent-runtime

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0" # 매주 월요일 05:00 KST
  # 릴리스 후보 태그에서 release-images 가 이미지를 굽기 전에 부른다. ref 는 그 태그다
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      # pr-check 는 자기 lint 잡이 ruff 를 이미 돌리므로 false 로 부른다
      lint:
        type: boolean
        default: true

# 혼자 돌 때(매주, 손으로)도 기본 토큰은 읽기만 한다. release-images 와 pr-check 가 부를 때는 부른 쪽 권한을 넘지 않는다
permissions:
  contents: read

concurrency:
  # 불릴 때 github.ref 는 부른 쪽 것이라, 손으로 돌린 release-images 가 매주 실행과 그룹을 나누지 않게 ref 입력을 먼저 쓴다
  group: agent-runtime-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  agent-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: agent-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: agent-runtime/uv.lock
          python-version: "3.12"
      - run: uv sync
      - name: ruff
        if: inputs.lint != false
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: pytest
        env:
          DAEGAM_TEST_PG_DSN: host=localhost port=5432 dbname=postgres user=postgres password=pw
          DAEGAM_TEST_REDIS_URL: redis://localhost:6379/0
          DAEGAM_TEST_REQUIRE_STORES: "1"
        run: uv run pytest -q
      - name: docker build
        run: |
          docker build -t daegam-agent-runtime:ci .
          docker run --rm --entrypoint python daegam-agent-runtime:ci -c 'import psycopg, deepagents'

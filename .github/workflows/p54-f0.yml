# P54·P54b 의 F0 측정과 F1 리허설 (docs/plan/phase-54-fewer-proxies.md 12절, phase-54b-remote-entries.md 11절). 손으로만
# 돈다(workflow_dispatch). 태그의 클러스터 e2e 잡(e2e-cluster.yml)처럼 arm64 실행기 안에 k3d 클러스터를 띄우고, 이미지를
# 그 자리에서 구워 노드에 넣은 뒤 ToolHive 오퍼레이터·cert-manager·대감 차트(deploy/dev/values-local.yaml 의 header
# 모드)·lab·mock-oidc 를 올려 scripts/f0 의 도구를 부른다. k3s 는 NetworkPolicy 를 집행한다. 비밀을 읽지 않고 레지스트리에
# 밀지 않는다. 결과는 잡 로그, 잡 요약과 아티팩트 f0-results-<조각> 이고 토큰·비밀번호를 싣지 않는다.
#
# 조각(잡마다 자기 실행기와 클러스터)
#   p54      F0.1·F0.2·F0.3 가운데 items 가 고른 것 (scripts/f0/p54.sh f0)
#   p54b     F0.4 (scripts/f0/p54b.sh f0)
#   p54-f1   P54 의 F1. 이 브랜치(B1 의 check/<PR>)의 트리와 earlier 의 트리를 함께 굽고, 앞 트리 설치, prepare, B1 설치,
#            check-new, 앞 트리로 되돌린 설치, check-old, B1 다시 설치, check-new 를 차례로 돈다. 설치마다 앞에서 watch 가
#            노출마다의 호출 루프를 돌린다. 두 번째 설치부터 차트를 local 모드로 렌더한다(auth.mode=local)
#   p54b-f1  P54b 의 F1. 같은 차례를 header 모드로 돈다
# F1 은 B1 이 있어야 뜻이 있다. B1 이 없는 트리에서 돌리면 check-new 는 앞단이 넘어가기를 상한까지 기다린 뒤 그대로 적는다.
#
#   gh workflow run p54-f0.yml -R <저장소> --ref develop -f mode=f0 -f items="f0.1 f0.2 f0.3 f0.4"
#   gh workflow run p54-f0.yml -R <저장소> --ref check/<PR> -f mode=f1 -f earlier=<앞 develop 의 sha> -f rehearse="p54 p54b"

name: p54-f0

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "f0 (measurements) or f1 (rehearsal on this branch and the earlier commit)"
        type: choice
        options: [f0, f1]
        default: f0
      items:
        description: "f0: items to run, space separated (f0.1 f0.2 f0.3 f0.4)"
        type: string
        default: "f0.1 f0.2 f0.3 f0.4"
      earlier:
        description: "f1: the earlier develop commit (40-character sha) to install first"
        type: string
        default: ""
      rehearse:
        description: "f1: rehearsals to run, space separated (p54 p54b)"
        type: string
        default: "p54 p54b"

permissions:
  contents: read

concurrency:
  group: p54-f0-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_FROZEN: "1"
  # e2e-cluster.yml 과 같은 판과 체크섬이다
  K3D_VERSION: v5.9.0
  K3D_SHA256: 03cde5cf23e6e8e67de5a039ecf26e5b85aca82fba3e5d13dadf904cd218a250
  K3S_IMAGE: rancher/k3s:v1.36.5-k3s1
  KUBECTL_VERSION: v1.36.5
  KUBECTL_SHA256: 88fc1aca8fd0c1b44fe379f67c39bd6858bdfc50241dc55775f84d0f5b31da3a
  HELM_VERSION: v3.21.4
  HELM_SHA256: b54c04b4e0b2540bbdc08c17a121dab70e9a2ed0de5705528fec68a5fd3b85a7
  TRAEFIK_CHART_VERSION: 41.6.1
  S2O_REF: v0.5.0
  CLUSTER: daegam
  KUBE_CONTEXT: k3d-daegam

jobs:
  # 입력을 조각 matrix 로 바꾼다. 고른 것은 잡 요약에 남는다
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        # pipefail 이 있어야 아래 파이썬의 sys.exit 가 tee 를 지나 이 단계를 실패시킨다
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          ITEMS: ${{ inputs.items }}
          EARLIER: ${{ inputs.earlier }}
          REHEARSE: ${{ inputs.rehearse }}
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, re, sys
          e = os.environ
          mode, items, rehearse = e["MODE"], e["ITEMS"].split(), e["REHEARSE"].split()
          shards = []
          if mode == "f0":
              bad = [i for i in items if i not in ("f0.1", "f0.2", "f0.3", "f0.4")]
              if bad:
                  sys.exit(f"::error::unknown items {bad}")
              p54 = [i for i in items if i != "f0.4"]
              if p54:
                  shards.append({"shard": "p54", "script": "p54", "items": " ".join(p54), "f1": False,
                                 "cert_manager": True, "helm_flags": ""})
              if "f0.4" in items:
                  shards.append({"shard": "p54b", "script": "p54b", "items": "f0.4", "f1": False,
                                 "cert_manager": False, "helm_flags": ""})
          else:
              if not re.fullmatch(r"[0-9a-f]{40}", e["EARLIER"]):
                  sys.exit("::error::f1 needs earlier, the 40-character sha of the earlier develop commit")
              bad = [r for r in rehearse if r not in ("p54", "p54b")]
              if bad:
                  sys.exit(f"::error::unknown rehearsals {bad}")
              for r in rehearse:
                  shards.append({"shard": f"{r}-f1", "script": r, "items": "", "f1": True,
                                 "cert_manager": r == "p54",
                                 "helm_flags": "--set auth.mode=local" if r == "p54" else ""})
          if not shards:
              sys.exit("::error::nothing to run")
          print(f"#### p54-f0 {mode}\n")
          for s in shards:
              print(f"- {s['shard']}: {('rehearsal from ' + e['EARLIER'][:12]) if s['f1'] else s['items']}")
          with open(e["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps({"include": shards}) + "\n")
          EOF

  f0:
    needs: plan
    name: f0 (${{ matrix.shard }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SHARD: ${{ matrix.shard }}
      SCRIPT: scripts/f0/${{ matrix.script }}.sh
      F1: ${{ matrix.f1 }}
      F1_HELM_FLAGS: ${{ matrix.helm_flags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # F1: 앞 공개 develop 의 트리를 이 checkout 옆(../earlier)에 둔다. 이 트리의 빌드 컨텍스트에 들어가지 않는다
      - name: earlier tree
        if: ${{ matrix.f1 }}
        env:
          EARLIER: ${{ inputs.earlier }}
        run: |
          git fetch --no-tags --depth 1 origin "$EARLIER"
          git worktree add --detach ../earlier FETCH_HEAD
          git -C ../earlier log -1 --format='earlier tree %H %cs'
      - name: spec2openapi
        run: git clone -q --depth 1 --branch "$S2O_REF" https://github.com/Seo-yul/spec2openapi.git ../spec2openapi
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: platform/uv.lock
          python-version: "3.12"
      - name: tools
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"
          curl -fsSL -o "$bin/k3d" "https://github.com/k3d-io/k3d/releases/download/$K3D_VERSION/k3d-linux-arm64"
          curl -fsSL -o "$bin/kubectl" "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/arm64/kubectl"
          curl -fsSL -o "$RUNNER_TEMP/helm.tgz" "https://get.helm.sh/helm-$HELM_VERSION-linux-arm64.tar.gz"
          sha256sum -c - <<EOF
          $K3D_SHA256  $bin/k3d
          $KUBECTL_SHA256  $bin/kubectl
          $HELM_SHA256  $RUNNER_TEMP/helm.tgz
          EOF
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-arm64/helm
          mv "$RUNNER_TEMP/linux-arm64/helm" "$bin/helm"
          chmod +x "$bin/k3d" "$bin/kubectl" "$bin/helm"
          echo "$bin" >>"$GITHUB_PATH"
          # 결과(아티팩트로 올린다)와 F1 의 상태(올리지 않는다)
          mkdir -p "$RUNNER_TEMP/f0-results" "$RUNNER_TEMP/f1-state"
          { echo "F0_OUT=$RUNNER_TEMP/f0-results"; echo "F1_STATE=$RUNNER_TEMP/f1-state"; } >>"$GITHUB_ENV"
      - name: uv sync (platform)
        working-directory: platform
        run: uv sync
      # F0 는 이 트리의 이미지를 판 태그(0.1.0)로, F1 은 두 트리의 플랫폼·UI 를 f1-earlier·f1-current 로 굽는다. MCP
      # 런타임과 lab 의 이미지는 이 트리의 것 하나다
      - name: build images
        run: |
          if [ "$F1" = true ]; then
            make -C ../earlier image-platform image-ui PLATFORM_VERSION=f1-earlier UI_VERSION=f1-earlier
            make image-s2o image-runtime image-lab image-platform image-ui \
              PLATFORM_VERSION=f1-current UI_VERSION=f1-current
          else
            make image-s2o image-runtime image-lab image-mock-oidc image-platform image-ui
          fi
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -E '^(daegam-|spec2openapi)'
      - name: create the k3d cluster
        run: |
          k3d cluster create "$CLUSTER" --image "$K3S_IMAGE" --k3s-arg '--disable=traefik@server:*' --wait --timeout 180s
          kubectl --context "$KUBE_CONTEXT" get nodes -o wide
      # e2e-cluster.yml 과 같다. 노드의 containerd 에 바로 넣고 빠진 것만 한 번 더 넣는다
      - name: import images
        run: |
          if [ "$F1" = true ]; then
            images=(daegam-platform:f1-earlier daegam-ui:f1-earlier daegam-platform:f1-current daegam-ui:f1-current)
          else
            images=(daegam-platform:0.1.0 daegam-ui:0.1.0)
          fi
          images+=(daegam-mcp-runtime:0.1.0 daegam-stub-spec-server:dev daegam-mock-soap:dev daegam-mock-petstore:dev)
          # mock-oidc 는 F0 의 oidc 행만 쓴다. F1 은 local·header 모드다
          [ "$F1" = true ] || images+=(daegam-mock-oidc:0.1.0)
          missing=("${images[@]}")
          for attempt in 1 2; do
            [ "$attempt" = 1 ] || echo "::warning::not in the k3d node after import, importing again: ${missing[*]}"
            k3d image import -c "$CLUSTER" --mode direct "${missing[@]}"
            have="$(docker exec "k3d-$CLUSTER-server-0" crictl images -o json)"
            left=()
            for i in "${missing[@]}"; do
              grep -q "\"docker.io/library/$i\"" <<<"$have" || left+=("$i")
            done
            missing=(${left[@]+"${left[@]}"})
            [ "${#missing[@]}" -gt 0 ] || break
          done
          for i in ${missing[@]+"${missing[@]}"}; do echo "::error::$i is not in the k3d node"; done
          [ "${#missing[@]}" -eq 0 ]
      - name: traefik
        run: |
          helm repo add traefik https://traefik.github.io/charts >/dev/null
          helm --kube-context "$KUBE_CONTEXT" upgrade -i traefik traefik/traefik --version "$TRAEFIK_CHART_VERSION" \
            -n traefik --create-namespace --wait --timeout 180s
          kubectl --context "$KUBE_CONTEXT" -n traefik get svc traefik
      # F1 의 첫 설치는 앞 트리의 것이다(ToolHive 판, cert-manager, lab 까지). 이 트리의 오퍼레이터는 B1 을 설치할 때
      # 올리고, 되돌린 설치에서도 내리지 않는다. CRD 는 앞으로만 간다(릴리스 흐름과 같다)
      - name: make operator-install
        run: |
          if [ "$F1" = true ]; then dir=../earlier; else dir=.; fi
          make -C "$dir" operator-install KUBE_CONTEXT="$KUBE_CONTEXT"
      - name: make cert-manager-up
        if: ${{ matrix.cert_manager }}
        run: |
          if [ "$F1" = true ]; then dir=../earlier; else dir=.; fi
          make -C "$dir" cert-manager-up KUBE_CONTEXT="$KUBE_CONTEXT"
      - name: make deploy-local
        if: ${{ !matrix.f1 }}
        run: make deploy-local KUBE_CONTEXT="$KUBE_CONTEXT" PLATFORM_TAG=0.1.0 UI_TAG=0.1.0
      - name: "f1: install the earlier tree"
        if: ${{ matrix.f1 }}
        run: make -C ../earlier deploy-local KUBE_CONTEXT="$KUBE_CONTEXT" PLATFORM_TAG=f1-earlier UI_TAG=f1-earlier
      - name: mock-oidc
        if: ${{ !matrix.f1 }}
        run: |
          kubectl --context "$KUBE_CONTEXT" apply -f deploy/dev/mock-oidc.yaml
          kubectl --context "$KUBE_CONTEXT" -n daegam-system rollout status deploy/mock-oidc --timeout=180s
      - name: make lab-up
        id: lab
        run: |
          if [ "$F1" = true ]; then dir=../earlier; else dir=.; fi
          make -C "$dir" lab-up KUBE_CONTEXT="$KUBE_CONTEXT"
      # 항목마다 한 단계다. 한 항목이 실패해도 다음 항목이 돈다(설치는 앞 단계들이 끝냈다)
      - name: f0.1
        if: ${{ !cancelled() && steps.lab.outcome == 'success' && contains(format(' {0} ', matrix.items), ' f0.1 ') }}
        run: bash scripts/f0/p54.sh f0 f0.1
      - name: f0.2
        if: ${{ !cancelled() && steps.lab.outcome == 'success' && contains(format(' {0} ', matrix.items), ' f0.2 ') }}
        run: bash scripts/f0/p54.sh f0 f0.2
      - name: f0.3
        if: ${{ !cancelled() && steps.lab.outcome == 'success' && contains(format(' {0} ', matrix.items), ' f0.3 ') }}
        run: bash scripts/f0/p54.sh f0 f0.3
      - name: f0.4
        if: ${{ !cancelled() && steps.lab.outcome == 'success' && contains(format(' {0} ', matrix.items), ' f0.4 ') }}
        run: bash scripts/f0/p54b.sh f0
      # F1 의 차례. 설치마다 앞에서 watch 가 호출 루프를 뒤에 띄우고, 설치 뒤의 check 가 그것을 멈춰 읽는다. prepare 뒤의
      # 단계는 앞 단계가 실패해도 돈다. check 하나가 실패해도 되돌림과 다시 설치하는 리허설은 남는다
      - name: "f1: prepare on the earlier tree"
        id: f1prep
        if: ${{ !cancelled() && matrix.f1 && steps.lab.outcome == 'success' }}
        run: bash "$SCRIPT" f1 prepare
      - name: "f1: watch and install this tree"
        if: ${{ !cancelled() && matrix.f1 && steps.f1prep.outcome == 'success' }}
        run: |
          bash "$SCRIPT" f1 watch
          make operator-install KUBE_CONTEXT="$KUBE_CONTEXT"
          make deploy-local KUBE_CONTEXT="$KUBE_CONTEXT" PLATFORM_TAG=f1-current UI_TAG=f1-current HELM_FLAGS="$F1_HELM_FLAGS"
      - name: "f1: check this tree"
        if: ${{ !cancelled() && matrix.f1 && steps.f1prep.outcome == 'success' }}
        run: bash "$SCRIPT" f1 check-new
      - name: "f1: watch and roll back to the earlier tree"
        if: ${{ !cancelled() && matrix.f1 && steps.f1prep.outcome == 'success' }}
        run: |
          bash "$SCRIPT" f1 watch
          make -C ../earlier deploy-local KUBE_CONTEXT="$KUBE_CONTEXT" PLATFORM_TAG=f1-earlier UI_TAG=f1-earlier \
            HELM_FLAGS="$F1_HELM_FLAGS"
      - name: "f1: check the earlier tree"
        if: ${{ !cancelled() && matrix.f1 && steps.f1prep.outcome == 'success' }}
        run: bash "$SCRIPT" f1 check-old
      - name: "f1: watch and install this tree again"
        if: ${{ !cancelled() && matrix.f1 && steps.f1prep.outcome == 'success' }}
        run: |
          bash "$SCRIPT" f1 watch
          make deploy-local KUBE_CONTEXT="$KUBE_CONTEXT" PLATFORM_TAG=f1-current UI_TAG=f1-current HELM_FLAGS="$F1_HELM_FLAGS"
      - name: "f1: check this tree again"
        if: ${{ !cancelled() && matrix.f1 && steps.f1prep.outcome == 'success' }}
        run: bash "$SCRIPT" f1 check-new
      - name: diagnostics
        if: ${{ failure() }}
        continue-on-error: true
        # 항목이 실패로 센 행이 있을 때마다 돈다. 로그는 공개이므로 자격 증명처럼 보이는 값을 지운다(scripts/f0/redact.sh)
        run: |
          k=(kubectl --context "$KUBE_CONTEXT")
          {
            "${k[@]}" get pods -A -o wide || true
            "${k[@]}" get events -A --sort-by=.lastTimestamp 2>/dev/null | tail -n 80 || true
            "${k[@]}" -n daegam-system logs deploy/daegam-platform --tail=200 || true
            "${k[@]}" -n toolhive-system logs deploy/toolhive-operator --tail=150 || true
            "${k[@]}" get mcpremoteproxies,virtualmcpservers,mcpserverentries,mcpauthzconfigs -A || true
          } 2>&1 | bash scripts/f0/redact.sh
      - name: summary
        if: ${{ always() }}
        run: |
          { echo "#### p54-f0 ($SHARD)"; echo; cat "$F0_OUT/summary.md" 2>/dev/null || echo "no results"; } \
            >>"$GITHUB_STEP_SUMMARY"
      - name: results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f0-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/f0-results
          retention-days: 30
          if-no-files-found: warn

# CI(sandbox): 코드 실행 작업 공간 서버(sandbox/daegam_sandbox, P40 F1)의 ruff + pytest. 언제 도는지는 platform.yml 과
# 같고, PR 에서는 sandbox/ 가 바뀌었을 때 pr-check 가 부른다. 서버는 표준 라이브러리만 쓰므로 dev 그룹만 깐다. 이미지가
# 싣는 데이터 작업 묶음이 import 되는지는 이미지 굽기의 빌드 단계가 본다. 리눅스 전용 시험(dumpable, PID 1 의 쓸기,
# 떼어 낸 프로세스, 고아 거두기 뒤의 RLIMIT_NPROC)은 macOS 의 로컬 게이트에서 건너뛰고 여기서 처음 돈다. 그래서 이 잡은
# 건너뛴 시험이 있으면 실패한다.

name: sandbox

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0" # 매주 월요일 05:00 KST
  # 릴리스 후보 태그에서 release-images 가 이미지를 굽기 전에 부른다. ref 는 그 태그다
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      # pr-check 는 자기 lint 잡이 ruff 를 이미 돌리므로 false 로 부른다
      lint:
        type: boolean
        default: true

# 혼자 돌 때(매주, 손으로)도 기본 토큰은 읽기만 한다. release-images 와 pr-check 가 부를 때는 부른 쪽 권한을 넘지 않는다
permissions:
  contents: read

concurrency:
  # 불릴 때 github.ref 는 부른 쪽 것이라, 손으로 돌린 release-images 가 매주 실행과 그룹을 나누지 않게 ref 입력을 먼저 쓴다
  group: sandbox-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: sandbox/uv.lock
          python-version: "3.12"
      - run: uv sync --only-dev
      # PID 1 의 쓸기 시험은 권한 없는 user·PID 이름공간(unshare)으로 서버를 PID 1 로 띄운다. Ubuntu 24.04 실행기는
      # AppArmor 가 권한 없는 user namespace 를 막아 두므로 이 잡에서만 푼다. ICMP 시험은 특권 없는 ICMP 소켓으로
      # 루프백에 echo 를 보내고 답을 받아야 한다. 실행기는 그 소켓을 막아 두므로 모든 그룹에 연다
      - name: allow unprivileged user namespaces and ICMP sockets
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - name: ruff
        if: inputs.lint != false
        run: |
          uv run --only-dev ruff check .
          uv run --only-dev ruff format --check .
      # -rs 가 건너뛴 시험과 까닭을 찍는다. 리눅스에서 건너뛴 것이 있으면 그 시험이 아무 데서도 돌지 않으므로 멈춘다.
      # shell: bash 는 bash -eo pipefail 이라 tee 앞의 pytest 가 실패하면 이 단계가 실패한다
      - name: pytest
        shell: bash
        run: |
          uv run --only-dev pytest -q -rs | tee "$RUNNER_TEMP/pytest.txt"
          if grep -q "^SKIPPED" "$RUNNER_TEMP/pytest.txt"; then
            echo "::error::sandbox tests were skipped on Linux; they run nowhere else"
            exit 1
          fi
